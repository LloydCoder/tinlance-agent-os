name: M16 one-time format

on:
  push:
    branches: [m16-durable-workflow-runtime]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: python -m pip install "ruff==0.16.9" && ruff format .
      - name: Commit formatted tree
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(m16): apply Ruff formatting"
          git push
