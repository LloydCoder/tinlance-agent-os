name: CI

on:
  push:
    branches: ["main", "m0-*", "audit/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pip-audit>=2.9"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Tests and coverage
        run: pytest --cov=tinlance_agent_os --cov-report=term-missing --cov-fail-under=85
      - name: Dependency audit
        if: matrix.python-version == '3.12'
        run: pip-audit

  architecture:
    name: Architecture boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Architecture tests
        run: pytest tests/architecture tests/contract -q
      - name: Verify workflow action pinning
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r"^\s*-\s*uses:\s*([^\s]+)@([^\s#]+)")
          for path in Path(".github/workflows").glob("*.yml"):
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = pattern.match(line)
                  if match and not re.fullmatch(r"[0-9a-f]{40}", match.group(2)):
                      raise SystemExit(
                          f"{path}:{line_number}: action reference is not immutable: {match.group(1)}"
                      )
          PY
