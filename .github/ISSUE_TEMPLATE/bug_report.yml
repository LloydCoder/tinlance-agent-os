name: Bug report
description: Report a reproducible defect in Tinlance Agent OS.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before opening a new report.
        Do not include secrets, credentials, customer data, or private information.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the package version or Git commit SHA.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: For example, Python 3.12.9.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, installation method, and relevant runtime configuration.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, secrets, and customer data.
    validations:
      required: false
