[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-agent-os"
version = "0.1.0"
description = "Tinlance Agentic OS: an agent-native operating environment built on the governed Tinlance Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Tinlance" }]
dependencies = ["opentelemetry-api>=1.37,<2", "opentelemetry-sdk>=1.37,<2"]

[project.optional-dependencies]
dev = ["mypy>=1.17", "pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.13"]

[project.scripts]
agentos = "tinlance_agent_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
